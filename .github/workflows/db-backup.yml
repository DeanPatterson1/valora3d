name: DB backup

# Nightly encrypted logical backup of the Supabase database to a dedicated R2 bucket, then retention (30 daily + 12 monthly).
# Runbook: docs/runbooks/disaster-recovery.md. The weekly db-restore-verify.yml proves the newest file restores.
#
# Repository secrets:   SUPABASE_DB_URL (session pooler URL, port 5432), R2_ACCOUNT_ID,
#                       R2_BACKUP_ACCESS_KEY_ID, R2_BACKUP_SECRET_ACCESS_KEY (token scoped to the backup bucket ONLY)
# Repository variables: R2_BACKUP_BUCKET (default valora3d-backups)
# A failed scheduled run emails the repository owner; the weekly verify job also fails when the newest backup is stale.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      prune_dry_run:
        description: "List what retention would delete, delete nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET || 'valora3d-backups' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 does not accept the newer default checksum trailers of AWS CLI v2.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Dump, compress and encrypt
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          file="$(scripts/backup-db.sh "$RUNNER_TEMP/backups" | tail -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Upload to R2
        env:
          FILE: ${{ steps.dump.outputs.file }}
        run: |
          set -euo pipefail
          day="$(basename "$FILE" .sql.gz.age)"   # YYYY-MM-DD
          key="backups/db/${day:0:4}/${day:5:2}/${day:8:2}.sql.gz.age"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$FILE" "s3://${R2_BACKUP_BUCKET}/${key}" --endpoint-url "$endpoint" --only-show-errors
          remote="$(aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BACKUP_BUCKET" --key "$key" --query ContentLength --output text)"
          local_size="$(wc -c < "$FILE" | tr -d ' ')"
          [ "$remote" = "$local_size" ] || { echo "uploaded $remote bytes but the file is $local_size"; exit 1; }
          echo "Uploaded $key ($remote bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retention (30 daily + 12 monthly)
        run: node scripts/backup-prune.mjs ${{ inputs.prune_dry_run && '--dry-run' || '' }}
